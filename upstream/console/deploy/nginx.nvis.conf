worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format nvis '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout nvis;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 8m;

  server {
    listen 127.0.0.1:4300;
    listen 192.168.10.3:4300;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-NVIS-Service "NVIS-P2P-Console" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location = /nvis-p2p-health {
      access_log off;
      default_type text/plain;
      return 200 "OK\n";
    }

    location = /healthy {
      proxy_pass http://127.0.0.1:12004;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }

    location /nvis/api/ {
      proxy_pass http://127.0.0.1:14300/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      add_header Cache-Control "no-store" always;
    }

    location ~ ^/(api|oapi)/ {
      proxy_pass http://127.0.0.1:12004;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      add_header Cache-Control "no-store" always;
    }

    location /static/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store";
    }
  }
}
